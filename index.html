                <p>A maioria dos modelos de <strong>${title}</strong> hoje utiliza sistemas brushless. Isso significa menos manutenção, mais velocidade e uma eficiência energética muito superior aos antigos motores com escovas. A resposta do gatilho é instantânea, proporcionando um controle preciso em curvas e saltos.</p>
                
                <h3 class="text-2xl font-bold mt-8 mb-4">2.2 Autonomia da Bateria</h3>
                <p>Com as novas células LiPo de 3S e 4S, o tempo de diversão aumentou drasticamente. Você pode esperar entre 20 a 40 minutos de uso intenso, dependendo do terreno. É sempre recomendável ter uma bateria reserva para não interromper a brincadeira.</p>

                <div class="my-12 p-8 bg-gray-900 rounded-3xl text-white text-center">

                    <p class="mb-6 opacity-80">Sempre verifique o aperto dos parafusos após o uso em terrenos acidentados. A vibração é o maior inimigo da mecânica RC.</p>

                <p>Para que seu <strong>${title}</strong> mantenha o desempenho de fábrica, a limpeza é fundamental. Use ar comprimido e pincéis macios para remover a poeira após cada sessão. Evite molhar componentes eletrônicos, a menos que o modelo seja explicitamente "waterproof".</p>
                <p>A lubrificação dos diferenciais e amortecedores também deve ser feita periodicamente, garantindo que a transmissão de potência seja suave e eficiente.</p>

                <h2 class="text-3xl font-bold mt-12 mb-6">4. Conclusão</h2>

                    <a href="https://pt.wikipedia.org/wiki/Automodelismo" target="_blank" class="text-xs text-gray-300 italic">Fonte: Wikipedia</a>

        }

        // Renderizar Mapa do Site

            <div class="columns-1 md:columns-3 gap-8 space-y-8">`;
            
            Object.entries(sitemap).forEach(([cat, pages]) => {
                html += `
                <div class="break-inside-avoid bg-white p-8 rounded-3xl border border-gray-100 shadow-sm">
                    <h2 class="text-xl font-black mb-6 uppercase tracking-tighter border-b-4 border-red-500 inline-block">${cat.replace(/-/g, ' ')}</h2>
                    <ul class="space-y-2">
                        ${pages.map(p => `<li><a href="#${p.slug}" class="text-gray-500 hover:text-red-500 font-medium text-sm">${p.title}</a></li>`).join('')}
                    </ul>
                </div>`;
            });
            
            html += `</div>`;
            return html;
        }

        // Sistema de Roteamento
        function navigateTo(slug) {
            const area = document.getElementById('content-area');
            window.scrollTo(0, 0);
            
            if (slug === 'home' || slug === '') {
                area.innerHTML = renderHome();
                document.title = "Portal RC 2026 - Início";
            } else if (slug === 'mapa-do-site') {
                area.innerHTML = renderSitemap();
                document.title = "Mapa do Site - Portal RC";
            } else {
                // Procurar a página nos dados
                let pageFound = null;
                Object.values(sitemap).forEach(cat => {
                    const p = cat.find(item => item.slug === slug);
                    if (p) pageFound = p;
                });
                
                if (pageFound) {
                    area.innerHTML = generateArticle(pageFound.title);
                    document.title = pageFound.title + " - Portal RC";
                } else {
                    area.innerHTML = `<div class="text-center py-24"><h1 class="text-4xl font-black">Página não encontrada</h1><a href="#" onclick="navigateTo('home')" class="text-red-500 underline">Voltar para o início</a></div>`;
                }
            }
        }

        // Escutar mudanças na URL (Hash)
        window.addEventListener('hashchange', () => {
            const slug = window.location.hash.replace('#', '');
            navigateTo(slug);
        });

        // Iniciar site
        window.onload = () => {
            initNav();
            const initialSlug = window.location.hash.replace('#', '');
            navigateTo(initialSlug || 'home');
        };
